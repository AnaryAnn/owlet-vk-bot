name: Расписание Робосычика без Apps Script
on:
  workflow_dispatch:
    inputs:
      job:
        description: Какое задание запустить
        type: choice
        default: evening
        options:
          - evening
          - sync
          - statistics
          - quests
  schedule:
    # 18:00 МСК: выпуск и статистика в её дни.
    - cron: '0 15 * * *'
    # Раз в час: старт квестов и завершение голосований.
    - cron: '17 * * * *'
    # Синхронизация: 00:00, 04:00, 08:00, 12:00, 16:00, 20:00 МСК.
    - cron: '0 1,5,9,13,17,21 * * *'
permissions: {}
concurrency:
  group: native-owlet-schedule
  cancel-in-progress: false
jobs:
  tick:
    if: vars.NATIVE_SCHEDULES_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Выполнить задания на Render
        env:
          OWLET_SCHEDULE_SECRET: ${{ secrets.OWLET_SCHEDULE_SECRET }}
          EVENT_NAME: ${{ github.event_name }}
          CRON: ${{ github.event.schedule }}
          MANUAL_JOB: ${{ inputs.job }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          from datetime import datetime
          from zoneinfo import ZoneInfo
          secret = os.environ.get('OWLET_SCHEDULE_SECRET', '')
          if not secret:
              raise SystemExit('Не настроен OWLET_SCHEDULE_SECRET')
          if os.environ['EVENT_NAME'] == 'workflow_dispatch':
              jobs = [os.environ.get('MANUAL_JOB') or 'evening']
          elif os.environ['CRON'] == '0 15 * * *':
              jobs = ['evening']
              if datetime.now(ZoneInfo('Europe/Moscow')).weekday() in (0, 4, 5, 6):
                  jobs.append('statistics')
          elif os.environ['CRON'] == '17 * * * *':
              jobs = ['quests']
          else:
              jobs = ['sync']
          print('Запрошены задания:', ', '.join(jobs))
          request = urllib.request.Request(
              'https://owlet-vk-bot.onrender.com/native-schedule',
              data=json.dumps({'jobs': jobs}).encode(),
              headers={'Content-Type': 'application/json', 'X-Schedule-Secret': secret}, method='POST')
          with urllib.request.urlopen(request, timeout=170) as response:
              result = json.load(response)
          # Только технические результаты, без текста переписки и секретов.
          for item in result.get('jobs', []):
              detail = item.get('result') if isinstance(item.get('result'), dict) else item
              print(json.dumps({k: detail[k] for k in
                  ('job', 'success', 'skipped', 'reason', 'peer_id', 'messages', 'cutoff', 'vk_response', 'error')
                  if k in detail}, ensure_ascii=False))
          if result.get('schedulerVersion') != 2:
              raise SystemExit('На Render ещё старая версия. Нужен деплой исправления расписания')
          if not result.get('success') or len(result.get('jobs', [])) != len(jobs):
              raise SystemExit('Задания не выполнены полностью. Проверьте журнал Render и версию деплоя')
          print('Вызов заданий завершён успешно')
          PY
